name: Build & Deploy Web Editor

# 构建并发布浏览器配置编辑器 (esp_iap_tool.html)
#
# 触发方式:
#   - push 到 main / master 分支 (自动部署到 GitHub Pages)
#   - 提交 PR (仅构建校验，不部署)
#   - 手动触发
#
# 产物:
#   - GitHub Pages 站点 (可直接在线使用编辑器)
#   - 构建好的 HTML 文件 (Artifact，可下载离线使用)
#
# 在线地址 (部署后):
#   https://<owner>.github.io/<repo>/esp_iap_tool.html

on:
  push:
    branches: [ main, master ]
    paths:
      - 'esp_iap_tool.html'
      - 'esp_iap_builtin.js'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'esp_iap_tool.html'
      - 'esp_iap_builtin.js'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  # 固件构建完成后自动重新部署，使页面内置镜像保持最新
  workflow_run:
    workflows: [ "Build IAP Firmware" ]
    types: [ completed ]
    branches: [ main, master ]
  workflow_dispatch:

# 部署 Pages 所需权限
permissions:
  contents: read
  actions: read        # 跨 workflow 下载 build.yml 的 artifact
  pages: write
  id-token: write

# 同一分支的重复触发取消旧任务
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EDITOR: esp_iap_tool.html

jobs:
  # ==========================================================================
  # 校验: 检查 HTML 完整性与 JS 语法
  # ==========================================================================
  verify:
    name: Verify Editor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 内置镜像数据 (esp_iap_builtin.js + assets/iap_img_*.js) 是构建产物，
      # 不在仓库中跟踪，由 build.yml 生成并上传为 artifact。
      # 跨 workflow 下载需显式指定 run-id，这里取最近一次成功的 build.yml。
      # 注意: artifact 里也含 esp_iap_tool.html，直接解到仓库根会与
      #       checkout 的文件冲突，因此先解到临时目录再挑选所需文件。
      - name: Fetch builtin images from latest build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RID: ${{ github.event.workflow_run.id }}
        run: |
          set -e
          # workflow_run 触发时直接用触发本次运行的 build run id；
          # 否则取最近一次成功的 build.yml。
          RID="$TRIGGER_RID"
          if [ -z "$RID" ] || [ "$RID" = "null" ]; then
            RID=$(gh run list --workflow=build.yml --branch=main \
                    --status=success --limit=1 --json databaseId \
                    --jq '.[0].databaseId')
          fi
          if [ -z "$RID" ] || [ "$RID" = "null" ]; then
            echo "::warning::未找到成功的 build.yml 运行，跳过内置镜像下载"
            exit 0
          fi
          echo "从 build.yml run $RID 下载 web-editor-builtin ..."
          rm -rf _builtin_tmp && mkdir -p _builtin_tmp
          if ! gh run download "$RID" -n web-editor-builtin -D _builtin_tmp; then
            echo "::warning::下载失败，页面将只能手动选择文件"
            exit 0
          fi
          # 只取索引与分芯片数据 (忽略 artifact 中的 esp_iap_tool.html)
          [ -f _builtin_tmp/esp_iap_builtin.js ] && \
            cp _builtin_tmp/esp_iap_builtin.js . || true
          if [ -d _builtin_tmp/assets ]; then
            mkdir -p assets
            cp _builtin_tmp/assets/iap_img_*.js assets/ 2>/dev/null || true
          fi
          rm -rf _builtin_tmp
          ls -lh esp_iap_builtin.js 2>/dev/null || true
          ls -lh assets/ 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 检查 HTML 文件存在且非空
      - name: Check file exists
        run: |
          if [ ! -f "$EDITOR" ]; then
            echo "::error::找不到 $EDITOR"
            exit 1
          fi
          SIZE=$(stat -c%s "$EDITOR")
          echo "文件大小: $SIZE 字节"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::文件过小，可能损坏"
            exit 1
          fi

      # 提取 <script type="module"> 并用 node 做语法检查
      - name: Extract and check JS syntax
        run: |
          python - <<'PY'
          import re, sys, pathlib
          html = pathlib.Path("esp_iap_tool.html").read_text(encoding="utf-8")
          m = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not m:
              print("::error::未找到 <script type=\"module\"> 块")
              sys.exit(1)
          js = m.group(1)
          pathlib.Path("_check.mjs").write_text(js, encoding="utf-8")
          print(f"提取 JS: {js.count(chr(10))} 行")
          PY
          node --check _check.mjs
          echo "JS 语法检查通过"

      # 校验 HTML 中的常量与 C 头文件一致（交叉验证）
      - name: Cross-check with Python tools
        run: |
          python tools/verify_html_editor.py

      # 校验内置镜像的惰性加载机制
      #
      # v6 起内置镜像不再内嵌 Base64 到 HTML，改为:
      #   esp_iap_builtin.js        → 索引 (window.BUILTIN_MANIFEST)
      #   assets/iap_img_<chip>.js  → 各芯片数据 (按需注入)
      #
      # 这里校验:
      #   1. HTML 中 BUILTIN_BOOTLOADERS 兼容层存在且为惰性加载形式
      #   2. 若 esp_iap_builtin.js 存在 (由 build.yml 生成)，校验其索引结构
      - name: Check builtin lazy-load wiring
        run: |
          python - <<'PY'
          import pathlib, re, sys

          html = pathlib.Path("esp_iap_tool.html").read_text(encoding="utf-8")

          # 1. 兼容层标记必须存在且唯一
          if html.count("BEGIN BUILTIN BOOTLOADERS") != 1:
              print("::error::BUILTIN BOOTLOADERS 标记缺失或重复")
              sys.exit(1)
          if html.count("END BUILTIN BOOTLOADERS") != 1:
              print("::error::BUILTIN BOOTLOADERS 结束标记缺失或重复")
              sys.exit(1)

          # 2. 惰性加载: 必须引用 esp_iap_builtin.js
          if "esp_iap_builtin.js" not in html:
              print("::error::HTML 未引用 esp_iap_builtin.js (惰性加载入口)")
              sys.exit(1)

          # 3. BUILTIN_BOOTLOADERS 应为兼容层 (非内嵌 Base64)
          mb = html.find("/* ==== BEGIN BUILTIN BOOTLOADERS")
          me = html.find("/* ==== END BUILTIN BOOTLOADERS ==== */")
          block = html[mb:me]
          if "window.BUILTIN_BOOTLOADERS" not in block:
              print("::error::BUILTIN_BOOTLOADERS 兼容层实现缺失")
              sys.exit(1)
          print("HTML 惰性加载接线检查通过")

          # 4. 若索引文件存在 (由 build.yml 生成)，校验其结构
          idx = pathlib.Path("esp_iap_builtin.js")
          if not idx.is_file():
              print("::warning::未找到 esp_iap_builtin.js (仅当 build.yml 已运行时才会生成)")
              sys.exit(0)

          js = idx.read_text(encoding="utf-8")
          if "window.BUILTIN_MANIFEST" not in js:
              print("::error::esp_iap_builtin.js 中未找到 BUILTIN_MANIFEST")
              sys.exit(1)
          if "chips:" not in js:
              print("::error::索引缺少 chips 字段")
              sys.exit(1)
          targets = ["esp32","esp32s2","esp32s3","esp32c2",
                     "esp32c3","esp32c5","esp32c6","esp32h2"]
          # 每个芯片条目形如: esp32: { file: "...", size: N, ... }
          present = [t for t in targets
                     if re.search(r'\b' + t + r':\s*\{', js)]
          missing = [t for t in targets if t not in present]
          if missing:
              print("::warning::索引缺少芯片: " + ", ".join(missing))
          if not present:
              print("::error::索引中没有任何芯片条目")
              sys.exit(1)
          print(f"索引校验通过 ({len(present)} 个芯片条目)")
          PY

      # 检查关键元素是否齐全
      - name: Check required elements
        run: |
          python - <<'PY'
          import pathlib, sys
          html = pathlib.Path("esp_iap_tool.html").read_text(encoding="utf-8")
          required = [
              'id="fileInput"', 'id="btnConnect"', 'id="btnFlash"',
              'id="btnDump"', 'id="btnDumpEdit"', 'id="burnTargetBar"',
              'id="dumpScope"', 'id="dumpScopeHint"',
              'CFG_MAGIC', 'USER_APP_ADDR', 'xmodemSend',
              'id="bootModeBuiltin"', 'id="bootModeManual"',
              'id="btnBootExport"', 'BUILTIN_BOOTLOADERS',
              'id="bootChipSelect"',
              'esp_iap_builtin.js', 'BUILTIN_MANIFEST',
          ]
          missing = [r for r in required if r not in html]
          if missing:
              print("::error::缺少关键元素: " + ", ".join(missing))
              sys.exit(1)
          print(f"关键元素检查通过 ({len(required)} 项)")
          PY

      - name: Upload verified HTML
        uses: actions/upload-artifact@v4
        with:
          name: web-editor
          path: ${{ env.EDITOR }}
          retention-days: 30

  # ==========================================================================
  # 部署: 发布到 GitHub Pages (仅 push 到主分支时)
  # ==========================================================================
  deploy:
    name: Deploy to Pages
    needs: verify
    runs-on: ubuntu-latest
    # push / 手动 / 固件构建完成后 均部署。
    # workflow_run 已由触发条件限制为 build.yml 完成事件，
    # 且 verify 通过才会执行，故无需再判断 conclusion。
    if: >-
      github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 build.yml 生成的内置镜像数据 (索引 + 各芯片数据)。
      # 缺失时页面仍可用「手动选择文件」模式，不影响部署。
      # 注意: artifact 里也含 esp_iap_tool.html，直接解到仓库根会与
      #       checkout 的文件冲突，因此先解到临时目录再挑选所需文件。
      - name: Fetch builtin images from latest build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RID: ${{ github.event.workflow_run.id }}
        run: |
          set -e
          # workflow_run 触发时直接用触发本次运行的 build run id；
          # 否则取最近一次成功的 build.yml。
          RID="$TRIGGER_RID"
          if [ -z "$RID" ] || [ "$RID" = "null" ]; then
            RID=$(gh run list --workflow=build.yml --branch=main \
                    --status=success --limit=1 --json databaseId \
                    --jq '.[0].databaseId')
          fi
          if [ -z "$RID" ] || [ "$RID" = "null" ]; then
            echo "::warning::未找到成功的 build.yml 运行，跳过内置镜像下载"
            exit 0
          fi
          echo "从 build.yml run $RID 下载 web-editor-builtin ..."
          rm -rf _builtin_tmp && mkdir -p _builtin_tmp
          if ! gh run download "$RID" -n web-editor-builtin -D _builtin_tmp; then
            echo "::warning::下载失败，页面将只能手动选择文件"
            exit 0
          fi
          # 只取索引与分芯片数据 (忽略 artifact 中的 esp_iap_tool.html)
          [ -f _builtin_tmp/esp_iap_builtin.js ] && \
            cp _builtin_tmp/esp_iap_builtin.js . || true
          if [ -d _builtin_tmp/assets ]; then
            mkdir -p assets
            cp _builtin_tmp/assets/iap_img_*.js assets/ 2>/dev/null || true
          fi
          rm -rf _builtin_tmp
          ls -lh esp_iap_builtin.js 2>/dev/null || true
          ls -lh assets/ 2>/dev/null || true

      # 组装站点目录
      - name: Prepare site
        run: |
          mkdir -p _site
          cp esp_iap_tool.html _site/index.html
          cp esp_iap_tool.html _site/esp_iap_tool.html
          # 内置镜像索引 + 分芯片数据 (惰性加载: assets/ 子目录)
          if [ -f esp_iap_builtin.js ]; then
            cp esp_iap_builtin.js _site/esp_iap_builtin.js
            mkdir -p _site/assets
            cp assets/iap_img_*.js _site/assets/ 2>/dev/null \
              || cp iap_img_*.js _site/assets/ 2>/dev/null || true
            echo "已包含内置镜像: $(ls _site/assets/ 2>/dev/null | wc -l) 个芯片"
          else
            echo "::warning::未找到 esp_iap_builtin.js, 页面将只能手动选择文件"
          fi
          cp README.md _site/README.md
          # 附带工具脚本，方便用户下载
          mkdir -p _site/tools
          cp tools/*.py _site/tools/
          cat > _site/.nojekyll <<'EOF'
          EOF
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================================================
  # 汇总
  # ==========================================================================
  summary:
    name: Summary
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Web 编辑器构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 校验 | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "❌ 校验失败，请查看上方日志" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ 已部署到 GitHub Pages" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "ℹ️ PR 仅校验，不部署" >> $GITHUB_STEP_SUMMARY
          fi
